# Virtual child 1 (Q18): high curiosity, low persistence.
# Tests: direct-capability evidence channel; planner response to low persistence.
profile:
  child_id: vc_curious
  name: 小豆
  age: 5
  stage: early_childhood
  initial_state:
    interests:
      animal: 0.9
      animal.rabbit: 0.8
      space: 0.7
    topic_mastery: {}   # mostly age priors
    capability_direct:
      curiosity: { level: 0.8, confidence: 0.6, evidence_count: 8 }
      persistence: { level: 0.3, confidence: 0.5, evidence_count: 6 }
evidence_timeline:
  - day: 1
    channel: free_observation
    raw_text: "看到蚂蚁搬家，蹲着看了二十分钟，问了十万个为什么，但让他把积木收好就不愿意了。"
  - day: 3
    channel: mission_checkin
    checkin_status: partial
    raw_text: "第一章的故事很喜欢，但找规律的游戏做了两个就说不想玩了。"
  - day: 5
    channel: child_retelling
    raw_text: "他说'豆豆兔找密码好笨，我一下子就看到是红黄红黄了'。"
  - day: 8
    channel: free_observation
    raw_text: "今天主动要求再玩一次昨天的排队游戏，玩了很久。"
  - day: 12
    channel: mission_checkin
    checkin_status: completed
    raw_text: "坚持完成了整个第三章，中间想放弃一次，自己又说再试试。"
